version: '3.9'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"

    redis:
      image: redis:latest
      ports:
        - "6379:6379"

    celery:
      build: .
      command: celery -A my_project worker --loglevel=info
      depends_on:
        - db
        - redis

    celery-beat:
      build: .
      command: celery -A my_project beat --loglevel=info
      depends_on:
        - db
        - redis
